services:
  ntshield-brain:
    build:
      context: ./ai-service
    container_name: nt-shield-brain
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      NTSHIELD_ENVIRONMENT: ${NTSHIELD_ENVIRONMENT:-development}
      NTSHIELD_DATABASE_PATH: /data/ntshield-brain.db
      NTSHIELD_PLAYBOOK_DIR: /app/playbooks
      NTSHIELD_LLM_ENABLED: ${NTSHIELD_LLM_ENABLED:-true}
      NTSHIELD_LLM_BASE_URL: ${NTSHIELD_LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      NTSHIELD_LLM_API_KEY: ${NTSHIELD_LLM_API_KEY:-local}
      NTSHIELD_LLM_MODEL: ${NTSHIELD_LLM_MODEL:-qwen3.5-9b}
      NTSHIELD_LLM_ENABLE_THINKING: ${NTSHIELD_LLM_ENABLE_THINKING:-false}
      NTSHIELD_ANALYSIS_MODE: ${NTSHIELD_ANALYSIS_MODE:-multi_agent}
      NTSHIELD_TENANTS_JSON: ${NTSHIELD_TENANTS_JSON:-[{"tenant_id":"demo","name":"NT Shield Demo","api_key":"change-me","central_verify_tls":false}]}
      NTSHIELD_ALLOW_DEV_TENANT: ${NTSHIELD_ALLOW_DEV_TENANT:-false}
      NTSHIELD_CORS_ORIGINS: ${NTSHIELD_CORS_ORIGINS:-}
    volumes:
      - ./data/ntshield-brain:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
